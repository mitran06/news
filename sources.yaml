# News Pipeline Source Configuration
# Read by scripts/fetch.sh — the Phase 1 fetch script
# Format: YAML, parsed by Python

rss_feeds:
  # Bleeding edge
  - {name: "hn-frontpage", url: "https://hnrss.org/frontpage", type: "rss"}
  - {name: "lobsters", url: "https://lobste.rs/rss", type: "rss"}
  - {name: "techmeme", url: "https://www.techmeme.com/feed.xml", type: "rss"}
  - {name: "producthunt", url: "https://www.producthunt.com/feed", type: "rss"}
  - {name: "slashdot", url: "https://rss.slashdot.org/Slashdot/slashdotMain", type: "rss"}
  # General tech
  - {name: "arstechnica", url: "https://feeds.arstechnica.com/arstechnica/index", type: "rss"}
  - {name: "verge", url: "https://www.theverge.com/rss/index.xml", type: "rss"}
  - {name: "techcrunch", url: "https://techcrunch.com/feed/", type: "rss"}
  - {name: "theregister", url: "https://www.theregister.com/headlines.atom", type: "rss"}
  - {name: "wired", url: "https://www.wired.com/feed/rss", type: "rss"}
  - {name: "bbc-tech", url: "https://feeds.bbci.co.uk/news/technology/rss.xml", type: "rss"}
  - {name: "ieee-spectrum", url: "https://spectrum.ieee.org/feeds/feed.rss", type: "rss"}
  # AI/ML
  - {name: "mit-tech-review", url: "https://www.technologyreview.com/feed/", type: "rss"}
  - {name: "marktechpost", url: "https://www.marktechpost.com/feed/", type: "rss"}
  - {name: "openai-blog", url: "https://openai.com/blog/rss.xml", type: "rss"}
  - {name: "google-ai-blog", url: "https://blog.google/technology/ai/rss/", type: "rss"}
  - {name: "huggingface", url: "https://huggingface.co/blog/feed.xml", type: "rss"}
  - {name: "nvidia-blog", url: "https://blogs.nvidia.com/feed/", type: "rss"}
  - {name: "ms-research", url: "https://www.microsoft.com/en-us/research/feed/", type: "rss"}
  - {name: "google-research", url: "https://research.google/blog/rss/", type: "rss"}
  - {name: "latent-space", url: "https://www.latent.space/feed", type: "rss"}
  - {name: "last-week-in-ai", url: "https://www.lastweekinai.com/feed", type: "rss"}
